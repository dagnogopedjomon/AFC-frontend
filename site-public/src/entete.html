<!-- En-tête commun à toutes les pages (accueil, règles, événements, blog, documents).
     Source unique : modifier ici, build.py l'insère à la place du marqueur ENTETE et marque la page en cours.
     Menu = pages du site seulement (pas les sections de l'accueil). Menu mobile sous 1020 px. -->
<style>
/* Variables lues sur la page (noms de commun.css, sinon ceux de la page des règles) */
.hd { --hd-bg: var(--background, var(--bg)); --hd-fg: var(--foreground, var(--ink)); --hd-muted: var(--muted-foreground, var(--muted));
  --hd-line: var(--border, var(--rule)); --hd-card: var(--card); --hd-accent: var(--primary, var(--accent)); --hd-on-accent: var(--primary-foreground, var(--on-accent));
  --hd-display: var(--font-display, var(--f-display)); --hd-body: var(--font-body, var(--f-body)); --hd-mono: var(--font-mono, var(--f-mono));
  --hd-ease: cubic-bezier(0.23, 1, 0.32, 1); --hd-gut: max(16px, env(safe-area-inset-left, 0px));
  position: sticky; top: 0; z-index: 50; font-family: var(--hd-body); color: var(--hd-fg);
  background: color-mix(in srgb, var(--hd-bg) 86%, transparent); -webkit-backdrop-filter: saturate(1.3) blur(14px); backdrop-filter: saturate(1.3) blur(14px);
  border-bottom: 1px solid var(--hd-line); padding-top: env(safe-area-inset-top, 0px);
  transition: background-color .3s ease, border-color .3s ease, -webkit-backdrop-filter .3s ease, backdrop-filter .3s ease; }
/* En haut de page, la barre se fond dans le premier bloc ; trait et flou au premier défilement */
.hd[data-top] { background: transparent; border-bottom-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
/* Le premier bloc de chaque page remonte sous la barre (sa couleur de fond passe dessous) */
.hd ~ main .ecran.hero, .hd ~ main > .phead:first-child, .hd ~ .bar {
  margin-top: calc(-66px - env(safe-area-inset-top, 0px)); border-top: calc(66px + env(safe-area-inset-top, 0px)) solid transparent; }
.hd ~ main > .phead:first-child::before, .hd ~ .bar::before { background-position: -1px -1px; }
@media (min-width: 760px) { .hd { --hd-gut: max(40px, env(safe-area-inset-left, 0px)); } }
.hd-in { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 28px; min-height: 66px; padding-left: var(--hd-gut); padding-right: max(var(--hd-gut), env(safe-area-inset-right, 0px)); }
.hd-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--hd-fg); flex: none; min-width: 0; }
.hd-brand img { width: 34px; height: auto; display: block; }
.hd-brand b { display: block; font: 500 18px/1.1 var(--hd-display); letter-spacing: -.01em; }
.hd-brand span { display: block; font: 500 10px/1.3 var(--hd-mono); text-transform: uppercase; letter-spacing: .14em; color: var(--hd-muted); margin-top: 2px; }
.hd-nav { display: flex; gap: 30px; justify-self: center; }
.hd-nav a { text-decoration: none; font-size: 14px; color: var(--hd-muted); position: relative; padding: 6px 0; transition: color .2s ease; }
.hd-nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--hd-accent); transform: scaleX(0); transform-origin: left; transition: transform 220ms var(--hd-ease); }
.hd-nav a[aria-current="page"] { color: var(--hd-fg); }
.hd-nav a[aria-current="page"]::after { transform: scaleX(1); }
@media (hover: hover) and (pointer: fine) { .hd-nav a:hover { color: var(--hd-fg); } .hd-nav a:hover::after { transform: scaleX(1); } }
.hd-tools { display: flex; align-items: center; gap: 10px; justify-self: end; }
.hd-icon { width: 42px; height: 42px; border-radius: .625rem; border: 1px solid var(--hd-line); background: var(--hd-card); color: var(--hd-fg); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; transition: transform 140ms var(--hd-ease), border-color .2s ease; }
.hd-icon:active { transform: scale(.94); }
.hd-icon svg { width: 18px; height: 18px; }
@media (hover: hover) and (pointer: fine) { .hd-icon:hover { border-color: var(--hd-accent); } }
.hd-cta { display: inline-flex; align-items: center; justify-content: center; gap: .55em; min-height: 42px; padding: 0 1.1em; border-radius: .625rem; border: 1px solid var(--hd-accent); background: var(--hd-accent); color: var(--hd-on-accent); font: 500 14px/1 var(--hd-body); text-decoration: none; white-space: nowrap; transition: transform 140ms var(--hd-ease), filter .2s ease; }
.hd-cta:active { transform: scale(.97); }
.hd-cta svg { width: 16px; height: 16px; flex: none; }
@media (hover: hover) and (pointer: fine) { .hd-cta:hover { filter: brightness(1.07); } }
.hd :focus-visible { outline: 2px solid var(--hd-accent); outline-offset: 3px; border-radius: 6px; }
.hd .moon { display: none; }
:root[data-theme="dark"] .hd .moon { display: block; } :root[data-theme="dark"] .hd .sun { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hd .moon { display: block; } :root:not([data-theme="light"]) .hd .sun { display: none; } }

/* Menu mobile : bouton à trois traits, panneau sous la barre */
.hd-burger { display: none; }
.hd-burger .x { display: none; }
.hd-burger[aria-expanded="true"] .x { display: block; } .hd-burger[aria-expanded="true"] .bars { display: none; }
.hd-panel { border-top: 1px solid var(--hd-line); background: var(--hd-bg); padding: 8px var(--hd-gut) 20px; max-height: calc(100dvh - 66px); overflow-y: auto; }
.hd-panel nav { display: grid; }
.hd-panel nav a { display: flex; align-items: center; justify-content: space-between; min-height: 54px; text-decoration: none; color: var(--hd-fg); font: 300 24px/1.1 var(--hd-display); letter-spacing: -.015em; border-bottom: 1px solid var(--hd-line); }
.hd-panel nav a[aria-current="page"] { color: var(--hd-accent); font-style: italic; }
.hd-panel nav a::after { content: "→"; font: 400 15px var(--hd-body); color: var(--hd-muted); }
.hd-panel .hd-cta { width: 100%; margin-top: 18px; min-height: 48px; }
@media (max-width: 1020px) {
  .hd-in { grid-template-columns: minmax(0, 1fr) auto; }
  .hd-nav { display: none; }
  .hd-burger { display: grid; }
  .hd-tools .hd-cta { display: none; }
}
@media (min-width: 1021px) { .hd-panel { display: none !important; } }
@media (max-width: 480px) { .hd-in { gap: 10px; } .hd-brand span { display: none; } }
@media (prefers-reduced-motion: reduce) { .hd * { transition: none !important; } }
</style>

<header class="hd" id="haut" data-top>
  <div class="hd-in">
    <a class="hd-brand" href="__HOME_TOP__"__HOME_EXT__ aria-label="Amicale Football Club, page d'accueil">
      <img src="__LOGO__" alt="" width="34" height="39">
      <div><b>Amicale FC</b><span>Abidjan · Cocody</span></div>
    </a>
    <nav class="hd-nav" aria-label="Menu principal">
      __MENU__
    </nav>
    <div class="hd-tools">
      <button class="hd-icon" id="theme" type="button" aria-label="Changer de thème">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
      </button>
      <a class="hd-cta" href="__APP__"__EXT__>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span>Accès membres</span>
      </a>
      <button class="hd-icon hd-burger" id="hd-burger" type="button" aria-expanded="false" aria-controls="hd-panel" aria-label="Ouvrir le menu">
        <svg class="bars" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="hd-panel" id="hd-panel" hidden>
    <nav aria-label="Menu principal (mobile)">
      __MENU__
    </nav>
    <a class="hd-cta" href="__APP__"__EXT__>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Accès membres</span>
    </a>
  </div>
</header>
<script>
(function () {
  "use strict";
  var root = document.documentElement, theme = document.getElementById("theme");
  var burger = document.getElementById("hd-burger"), panel = document.getElementById("hd-panel");
  /* Thème clair / sombre : suit l'appareil, sauf choix du visiteur (même clé que l'appli) */
  try { var s = localStorage.getItem("afc-theme"); if (s === "light" || s === "dark") root.setAttribute("data-theme", s); } catch (e) {}
  function isDark() { var a = root.getAttribute("data-theme"); return a ? a === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
  function label() { theme.setAttribute("aria-label", isDark() ? "Passer au thème clair" : "Passer au thème sombre"); }
  label();
  theme.addEventListener("click", function () {
    var n = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", n);
    try { localStorage.setItem("afc-theme", n); } catch (e) {}
    label();
    document.dispatchEvent(new CustomEvent("afc-theme", { detail: n }));
  });
  /* Barre transparente tant que la page n'a pas défilé (et que le menu mobile est fermé) */
  var hd = document.getElementById("haut");
  function etat() { if (window.scrollY < 8 && panel.hidden) hd.setAttribute("data-top", ""); else hd.removeAttribute("data-top"); }
  window.addEventListener("scroll", etat, { passive: true });
  etat();
  /* Menu mobile */
  function setOpen(open, focusBack) {
    panel.hidden = !open;
    burger.setAttribute("aria-expanded", String(open));
    burger.setAttribute("aria-label", open ? "Fermer le menu" : "Ouvrir le menu");
    etat();
    if (!open && focusBack) burger.focus();
  }
  burger.addEventListener("click", function () { setOpen(panel.hidden); });
  panel.addEventListener("click", function (ev) { if (ev.target.closest("a")) setOpen(false); });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !panel.hidden) setOpen(false, true); });
  document.addEventListener("click", function (ev) { if (!panel.hidden && !ev.target.closest(".hd")) setOpen(false); });
  matchMedia("(min-width: 1021px)").addEventListener("change", function (m) { if (m.matches) setOpen(false); });
})();
</script>
