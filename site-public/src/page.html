  "use strict";
  var root = document.documentElement, $ = function (id) { return document.getElementById(id); };
  /* Blog : filtre par catégorie */
  var posts = $("posts");
  if (posts) document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      var f = b.getAttribute("data-f");
      document.querySelectorAll(".tabs button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      posts.querySelectorAll(".post").forEach(function (p) { p.hidden = f !== "all" && p.getAttribute("data-cat") !== f; });
    });
  });
})();
</script>
