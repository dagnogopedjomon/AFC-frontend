# Dépôt automatique du site sur l'hébergement Hostinger du club.
#
# Fabrique le site (page d'accueil publique + application) et le téléverse
# dans public_html par FTP. L'envoi est incrémental : seuls les fichiers
# modifiés partent, grâce à l'état de synchronisation laissé sur le serveur.
#
# Se déclenche :
#   - à chaque mise à jour du code sur main ;
#   - à la main, depuis l'onglet Actions (bouton « Run workflow ») ;
#   - à la demande de l'application, quand un contenu est publié ou retiré
#     (événement repository_dispatch de type « publication »).
#
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   FTP_SERVER     l'adresse FTP de Hostinger
#   FTP_USERNAME   l'identifiant FTP
#   FTP_PASSWORD   le mot de passe FTP
#
# Variables (même écran, onglet « Variables ») — facultatives, des valeurs
# par défaut sont prévues :
#   API_URL        adresse de l'API du club (défaut : https://agbolo.ci/afc-api)
#   FTP_PORT       port FTP (défaut : 21)
#
# FTP_SERVER contient l'adresse que Hostinger affiche dans hPanel, qui est
# une adresse IP. Voir le commentaire de l'étape de téléversement au sujet
# de la vérification du certificat.

name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [publication]

# Un seul déploiement à la fois : si deux publications se suivent, la plus
# récente remplace la précédente plutôt que de téléverser deux fois.
concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installer Python (générateur du site public)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: npm ci

      - name: Fabriquer le site
        env:
          # Lue par l'application dans le navigateur.
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'https://agbolo.ci/afc-api' }}
          # Lue par le générateur pour récupérer les contenus publiés.
          AFC_API_URL: ${{ vars.API_URL || 'https://agbolo.ci/afc-api' }}
        run: npm run build

      - name: Vérifier que le site a bien été fabriqué
        run: |
          test -f out/index.html || { echo "Le site n'a pas été fabriqué."; exit 1; }
          test -d out/dashboard || { echo "L'application est absente."; exit 1; }
          echo "$(find out -type f | wc -l) fichiers prêts à être envoyés."

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Téléverser dans public_html
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          # Lu par lftp via --env-password : le mot de passe ne figure jamais
          # dans une ligne de commande, donc jamais dans le journal.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
        run: |
          # Envoi en FTPS explicite (AUTH TLS), canal de données chiffré lui
          # aussi. La chaîne du certificat, son autorité et sa date de
          # validité sont vérifiées. Seule la comparaison du nom d'hôte est
          # désactivée, sur décision explicite du club : Hostinger ne publie
          # aucun nom pour ce serveur, seulement l'adresse 147.79.103.16,
          # alors que son certificat est émis pour *.hstgr.io. La
          # correspondance ne peut donc jamais réussir ici.
          #
          # lftp remplace ici l'action FTP-Deploy : celle-ci est écrite pour
          # Node 20, que GitHub n'exécute plus, et sous Node 24 elle ne
          # réutilise plus la session TLS sur le canal de données — ce que le
          # ProFTPD de Hostinger exige, d'où la coupure « ECONNRESET ».
          #
          # « mirror -R » ne transfère que ce qui a changé et « --delete »
          # retire du serveur ce qui a disparu du site : une page d'événement
          # retirée disparaît donc aussi en ligne.
          #
          # Les fichiers propres à l'hébergeur sont exclus : lftp les ignore
          # entièrement, donc il ne les écrase ni ne les supprime.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-auth TLS;
            set ssl:verify-certificate yes;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 3;
            set cmd:fail-exit true;
            open -u \"$FTP_USER\" --env-password -p \"$FTP_PORT\" \"$FTP_HOST\";
            mirror -R --delete --verbose=1 \
              --exclude-glob .git* \
              --exclude-glob .htaccess \
              --exclude-glob default.php \
              --exclude-glob cgi-bin/ \
              --exclude-glob node_modules/ \
              ./out/ /public_html/;
          "
          echo "Dépôt terminé."
